name: Refresh untagged pins

on:
  schedule:
    # trivy-action publishes no tags, crane has no Dependabot coverage, and
    # the Cosign binary version is an installer input - none of these get
    # automated updates. Check monthly and file an issue on drift.
    #
    # Note: this workflow deliberately opens an *issue*, not a PR. GitHub
    # refuses pushes to .github/workflows/* with GITHUB_TOKEN (workflows
    # permission boundary), and minting a standing PAT just to bypass that
    # would trade away more security than the automation is worth.
    # Applying the issue is a two-line edit that goes through a normal PR,
    # which the build workflow's validation run then proves before merge.
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check for newer pins
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=".github/workflows/build.yml"
          report="$(mktemp)"
          {
            echo "Untagged pins with upstream drift (checked $(date -u +%F)):"
            echo
          } > "${report}"
          drift="false"
          # 1. trivy-action master HEAD (no tags published upstream)
          trivy_current="$(grep -oP 'aquasecurity/trivy-action@\K[0-9a-f]{40}' "${file}" | head -1)"
          trivy_latest="$(gh api repos/aquasecurity/trivy-action/commits/master --jq .sha)"
          if [ "${trivy_current}" != "${trivy_latest}" ]; then
            drift="true"
            {
              echo "- trivy-action: \`${trivy_current:0:12}\` -> \`${trivy_latest:0:12}\`"
              echo "  Replace \`aquasecurity/trivy-action@${trivy_current}\` with \`aquasecurity/trivy-action@${trivy_latest}\` (both occurrences) and update the date comment."
              echo
            } >> "${report}"
          fi
          # 2. crane image digest (no tags to track, pinned by digest)
          crane_current="$(grep -oP 'go-containerregistry/crane@\Ksha256:[0-9a-f]{64}' "${file}" | head -1)"
          crane_latest="$(docker buildx imagetools inspect gcr.io/go-containerregistry/crane:latest | grep -m1 'Digest:' | awk '{print $2}')"
          if [ -z "${crane_latest}" ]; then
            echo "Failed to resolve crane digest" >&2
            exit 1
          fi
          if [ "${crane_current}" != "${crane_latest}" ]; then
            drift="true"
            {
              echo "- crane: \`${crane_current:0:19}\` -> \`${crane_latest:0:19}\`"
              echo "  Replace \`gcr.io/go-containerregistry/crane@${crane_current}\` with \`gcr.io/go-containerregistry/crane@${crane_latest}\`."
              echo
            } >> "${report}"
          fi
          # 3. Cosign binary version (installer input, invisible to Dependabot).
          # Track the latest v2 release; v3 is a new major line and needs a
          # deliberate migration, not a silent bump.
          cosign_current="$(grep -oP 'cosign-release: \Kv[\d.]+' "${file}" | head -1)"
          cosign_latest="$(gh api "repos/sigstore/cosign/releases?per_page=20" --jq '[.[] | select(.tag_name | startswith("v2."))][0].tag_name')"
          cosign_overall="$(gh api repos/sigstore/cosign/releases/latest --jq .tag_name)"
          if [ "${cosign_current}" != "${cosign_latest}" ]; then
            drift="true"
            {
              echo "- Cosign binary: \`${cosign_current}\` -> \`${cosign_latest}\`"
              echo "  Replace \`cosign-release: ${cosign_current}\` with \`cosign-release: ${cosign_latest}\`."
              echo
            } >> "${report}"
          fi
          if [ "${cosign_overall}" != "${cosign_latest}" ]; then
            {
              echo "FYI: newest Cosign overall is \`${cosign_overall}\` (new major line - migrate deliberately, do not auto-apply)."
              echo
            } >> "${report}"
          fi
          echo "drift=${drift}" >> "${GITHUB_OUTPUT}"
          if [ "${drift}" = "true" ]; then
            summary="$(grep -E '^- ' "${report}" | head -3 | tr '\n' ' ')"
            echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
            cat "${report}"
            cp "${report}" /tmp/pin-refresh-report.md
          else
            echo "All untagged pins are up to date."
          fi

      - name: Open or update tracking issue
        if: steps.refresh.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          set -euo pipefail
          title="Refresh untagged pins"
          body="$(cat /tmp/pin-refresh-report.md)
          Apply via PR - the build workflow's validation run proves the new pins before merge."
          existing="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Updated existing issue #${existing}."
          else
            gh issue create --title "${title}" --body "${body}"
          fi
